<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>主体税费申报核对查看器</title>
<style>


































:root{--bg:#0f172a;--sf:#1e293b;--sf2:#334155;--bd:#475569;--tx:#f1f5f9;--tx2:#94a3b8;--p:#3b82f6;--hi:#ef4444;--hi-bg:#3b1111;--md:#f59e0b;--md-bg:#3b2f11;--lo:#3b82f6;--lo-bg:#1e3a5f;--ok:#22c55e;--ok-bg:#0f3320}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Segoe UI','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--tx);line-height:1.5}
.app{max-width:1400px;margin:0 auto;padding:16px}
.hdr{text-align:center;padding:16px 0 8px}
.hdr h1{font-size:22px;font-weight:700}
.hdr .sub{color:var(--tx2);font-size:13px;margin-top:2px}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:12px 0}
.scard{padding:12px;border-radius:8px;text-align:center;border:1px solid var(--bd);background:var(--sf);cursor:pointer;transition:all .2s}
.scard:hover{transform:translateY(-2px)}.scard.act{box-shadow:0 0 12px rgba(59,130,246,.4)}
.scard .val{font-size:28px;font-weight:700}
.scard .lbl{font-size:11px;color:var(--tx2)}
.scard.hi .val{color:var(--hi)}.scard.md .val{color:var(--md)}.scard.lo .val{color:var(--lo)}.scard.ok .val{color:var(--ok)}
.fbar{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap;align-items:center}
.fbar label{font-size:12px;color:var(--tx2);margin-right:4px}
.fsel{padding:6px 10px;border-radius:6px;background:var(--sf);border:1px solid var(--bd);color:var(--tx);font-size:12px}
.fbtn{padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:500;background:var(--sf);border:1px solid var(--bd);color:var(--tx2);transition:all .2s}
.fbtn:hover{background:var(--sf2)}.fbtn.act{background:var(--p);color:#fff;border-color:var(--p)}
.rtable{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
.rtable th{background:var(--sf2);color:var(--tx2);font-weight:600;text-align:center;padding:8px;border:1px solid var(--bd);position:sticky;top:0;z-index:1}
.rtable td{padding:6px 8px;border:1px solid var(--bd);vertical-align:top}
.rtable tr:hover td{background:var(--sf)}
.rtable .num{text-align:right;font-variant-numeric:tabular-nums}
.rtable .neg{color:var(--hi)}
.rtable .ctr{text-align:center}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700}
.badge.hi{background:var(--hi);color:#fff}.badge.md{background:var(--md);color:#000}.badge.lo{background:var(--lo);color:#fff}
.stbadge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;cursor:pointer;transition:all .15s}
.stbadge:hover{opacity:.8}
.stbadge.open{background:#7c2d12;color:#fed7aa}.stbadge.resolved{background:var(--ok-bg);color:var(--ok)}.stbadge.ignored{background:var(--sf2);color:var(--tx2)}
.sec{margin:16px 0}.sec-t{font-size:16px;font-weight:600;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid var(--bd)}
.dpanel{background:var(--sf);border:1px solid var(--bd);border-radius:8px;margin:8px 0;overflow:hidden}
.dhdr{padding:10px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.dhdr:hover{background:var(--sf2)}.dhdr h3{font-size:14px}
.dbody{padding:0 14px 12px;display:none}
.dpanel.open .dbody{display:block}
.ap-tbl{width:100%;border-collapse:collapse;font-size:12px;margin:4px 0}
.ap-tbl th{background:var(--sf2);color:var(--tx2);padding:4px 6px;border:1px solid var(--bd);text-align:center;font-size:11px}
.ap-tbl td{padding:3px 6px;border:1px solid var(--bd);text-align:right;font-variant-numeric:tabular-nums;font-size:12px}
.ap-tbl .lbl{text-align:left}
.ap-tbl .warn{background:var(--hi-bg);color:var(--hi)}
.ap-tbl .good{background:var(--ok-bg);color:var(--ok)}
.cmp-row{display:flex;align-items:center;gap:4px;margin:2px 0;font-size:11px}
.cmp-bar{height:14px;border-radius:3px;min-width:2px}
.cmp-bar.acc{background:var(--md)}.cmp-bar.pay{background:var(--ok)}
.cmp-lbl{width:50px;text-align:right;color:var(--tx2);font-size:10px}
.cmp-val{width:80px;font-variant-numeric:tabular-nums}
.entries{max-height:300px;overflow-y:auto;font-size:11px;margin:4px 0}
.entries table{width:100%;border-collapse:collapse}
.entries th{background:var(--sf2);color:var(--tx2);padding:3px 5px;border:1px solid var(--bd);text-align:center;position:sticky;top:0;font-size:10px}
.entries td{padding:2px 5px;border:1px solid var(--bd);font-size:11px}
.entries .num{text-align:right;font-variant-numeric:tabular-nums}
.entries .acc{color:var(--md)}.entries .pay{color:var(--ok)}.entries .off{color:var(--tx2)}
.ebar{display:flex;gap:8px;justify-content:flex-end;margin:8px 0}
.ebar button{padding:6px 14px;border-radius:6px;background:var(--p);color:#fff;border:none;cursor:pointer;font-size:12px}
.ebar button:hover{opacity:.9}
@media(max-width:768px){.summary-grid{grid-template-columns:repeat(2,1fr)}.rtable{font-size:11px}}


































</style>
</head>
<body>
<div class="app" id="app"></div>


<script>


































'use strict';
var DATA,RISK_STATUS={},ENTITY_FILTER=null,RISK_FILTER=null;
var ENTRIES_DATA,NOTES={};



// === GitHub API Layer (cloud sync + localStorage cache) ===
var GH_REPO = 'Zhuang89406281/tax-viewer';
var GH_TOKEN = (function(){
  // Token from URL hash: #token=ghp_xxx  or from localStorage
  var m = location.hash.match(/token=([a-zA-Z0-9_]+)/);
  if(m){ localStorage.setItem('gh_token', m[1]); history.replaceState(null,'',location.pathname+location.search); return m[1]; }
  return localStorage.getItem('gh_token') || '';
})();
var GH_FILE = 'shared_data.json';
var GH_SHA = '';  // current file SHA for updates
var _ghAvailable = false;

function apiLoad() {
  fetch('https://api.github.com/repos/' + GH_REPO + '/contents/' + GH_FILE, {
    headers: {'Authorization': 'token ' + GH_TOKEN, 'User-Agent': 'hermes'}
  }).then(function(r) {
    if (!r.ok) { _ghAvailable = false; return null; }
    return r.json();
  }).then(function(finfo) {
    if (!finfo || !finfo.content) return;
    _ghAvailable = true;
    GH_SHA = finfo.sha;
    var d = JSON.parse(atob(finfo.content));
    // Merge cloud data into local (cloud wins on conflict)
    if (d.notes) { Object.assign(NOTES, d.notes); localStorage.setItem('taxNotes', JSON.stringify(NOTES)); }
    if (d.riskStatus) { Object.assign(RISK_STATUS, d.riskStatus); localStorage.setItem('taxRiskStatus5', JSON.stringify(RISK_STATUS)); }
    if (d.taxRules) { Object.assign(TAX_RULES, d.taxRules); saveTaxRules(); }
    render();
  }).catch(function() { _ghAvailable = false; });
}

function apiSave(changes) {
  if (!_ghAvailable && !GH_SHA) return;
  // Read current cloud data, merge changes, then write back
  var url = 'https://api.github.com/repos/' + GH_REPO + '/contents/' + GH_FILE;
  fetch(url, {
    headers: {'Authorization': 'token ' + GH_TOKEN, 'User-Agent': 'hermes'}
  }).then(function(r) { return r.json(); }).then(function(finfo) {
    if(!finfo||!finfo.content)return;
    GH_SHA = finfo.sha;
    var cloudData = JSON.parse(atob(finfo.content));
    // Merge incoming changes
    for (var key in changes) {
      if (changes.hasOwnProperty(key) && typeof changes[key] === 'object') {
        if (!cloudData[key]) cloudData[key] = {};
        for (var k in changes[key]) {
          if (changes[key].hasOwnProperty(k)) {
            if (changes[key][k] === null) { delete cloudData[key][k]; }
            else { cloudData[key][k] = changes[key][k]; }
          }
        }
      }
    }
    cloudData.lastModified = new Date().toISOString();
    // Write back
    var payload = {
      message: 'update shared data',
      content: btoa(unescape(encodeURIComponent(JSON.stringify(cloudData)))),
      sha: GH_SHA
    };
    return fetch(url, {
      method: 'PUT',
      headers: {'Authorization': 'token ' + GH_TOKEN, 'Content-Type': 'application/json', 'User-Agent': 'hermes'},
      body: JSON.stringify(payload)
    });
  }).then(function(r) {
    if (!r) return;
    return r.json();
  }).then(function(result) {
    if (result && result.content) {
      GH_SHA = result.content.sha;
    }
  }).catch(function(err) { console.error('apiSave error', err); });
}

// Auto-sync every 30 seconds
setInterval(function() { if (_ghAvailable) apiLoad(); }, 30000);

// Force-save all user data before page unload (hard rule: no data loss)
window.addEventListener('beforeunload',function(){
  localStorage.setItem('taxNotes',JSON.stringify(NOTES));
  localStorage.setItem('taxRiskStatus5',JSON.stringify(RISK_STATUS));
  localStorage.setItem('taxRules',JSON.stringify(TAX_RULES));
});


// === Password Gate ===
var _pw=(function(){var a='321@cetni';var b='xed';return b.split('').reverse().join('')+a.split('').reverse().join('')})();
var PW_AUTHED=sessionStorage.getItem('pw_ok')==='1';
function showPwGate(){
  document.body.innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0d1117"><div style="background:#161b22;border:1px solid #30363d;border-radius:12px;padding:40px;text-align:center;max-width:400px"><div style="font-size:48px;margin-bottom:16px">&#128274;</div><div style="color:#e6edf3;font-size:20px;font-weight:600;margin-bottom:8px">&#31246;&#36153;&#30003;&#25253;&#26680;&#23545;&#26597;&#30475;&#22120;</div><div style="color:#8b949e;font-size:14px;margin-bottom:24px">&#35831;&#36755;&#20837;&#35775;&#38382;&#23494;&#30721;</div><input id="pwInput" type="password" placeholder="&#23494;&#30721;" style="width:100%;padding:12px 16px;border:1px solid #30363d;border-radius:8px;background:#0d1117;color:#e6edf3;font-size:16px;outline:none;box-sizing:border-box"><div id="pwErr" style="color:#f85149;font-size:13px;margin-top:8px;display:none">&#23494;&#30721;&#38169;&#35823;&#65292;&#35831;&#37325;&#35797;</div><button id="pwBtn" style="width:100%;margin-top:16px;padding:12px;background:#238636;color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer;font-weight:600">&#36827;&#20837;</button></div></div>';
  document.getElementById('pwInput').focus();
  document.getElementById('pwInput').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pwBtn').click()});
  document.getElementById('pwBtn').addEventListener('click',function(){
    var v=document.getElementById('pwInput').value;
    if(v===_pw){sessionStorage.setItem('pw_ok','1');document.body.innerHTML='<div style="padding:40px;color:#0f0;font-size:24px">密码正确，正在加载...</div>';setTimeout(function(){location.reload()},500)}
    else{document.getElementById('pwErr').style.display='block';document.getElementById('pwInput').value='';document.getElementById('pwInput').focus()}
  });
}
var _pwBlocked=false;
if(!PW_AUTHED){showPwGate();_pwBlocked=true;}else{}

function init(){
  try{var s=localStorage.getItem('taxRiskStatus5');if(s)RISK_STATUS=JSON.parse(s)}catch(e){}
  try{var n=localStorage.getItem('taxNotes');if(n)NOTES=JSON.parse(n)}catch(e){}
  // Load data from GitHub API (requires GH_TOKEN)
  if(GH_TOKEN){
    loadDataFromGitHub();
  } else {
    // No token - try localStorage cache
    var cached=localStorage.getItem('_cachedData');
    if(cached){try{var cd=JSON.parse(cached);DATA=cd.data;ENTRIES_DATA=cd.entries;DATA=DATA.filter(function(e){return !/核对/.test(e.entity)&&e.entity});render();apiLoad()}catch(e){showNoData()}}
    else{showNoData()}
  }
}
function loadDataFromGitHub(){
  document.getElementById('app').innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0d1117;color:#58a6ff;font-size:18px">&#8987; &#27491;&#22312;&#21152;&#36733;&#31246;&#36153;&#25968;&#25454;...</div>';
  var repo=GH_REPO;var tk=GH_TOKEN;
  fetch('https://api.github.com/repos/'+repo+'/contents/viewer_data_full.json',{headers:{'Authorization':'token '+tk,'User-Agent':'hermes'}})
  .then(function(r){if(!r.ok)throw new Error('data fetch '+r.status);return r.json()})
  .then(function(finfo){
    DATA=JSON.parse(atob(finfo.content.replace(/\n/g,'')));
    DATA=DATA.filter(function(e){return !/核对/.test(e.entity)&&e.entity});
    return fetch('https://api.github.com/repos/'+repo+'/contents/entries_data_full.json',{headers:{'Authorization':'token '+tk,'User-Agent':'hermes'}})
  })
  .then(function(r){if(!r.ok)throw new Error('entries fetch '+r.status);return r.json()})
  .then(function(finfo){
    ENTRIES_DATA=JSON.parse(atob(finfo.content.replace(/\n/g,'')));
    try{localStorage.setItem('_cachedData',JSON.stringify({data:DATA,entries:ENTRIES_DATA}))}catch(e){}
    render();
    apiLoad();
  })
  .catch(function(e){
    var cached=localStorage.getItem('_cachedData');
    if(cached){try{var cd=JSON.parse(cached);DATA=cd.data;ENTRIES_DATA=cd.entries;DATA=DATA.filter(function(e){return !/核对/.test(e.entity)&&e.entity});render();apiLoad()}catch(ex){showNoData()}}
    else{showNoData()}
  });
}
function showNoData(){
  document.getElementById('app').innerHTML='<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0d1117;color:#f85149;font-size:18px;text-align:center"><div>&#9888; &#26080;&#27861;&#21152;&#36733;&#25968;&#25454;<br><span style="color:#8b949e;font-size:14px">&#35831;&#30830;&#20445;&#35777;&#35775;&#38382;&#38142;&#25509;&#21253;&#21547;token&#21442;&#25968;</span></div></div>';
}
function save(){localStorage.setItem('taxRiskStatus5',JSON.stringify(RISK_STATUS));apiSave({riskStatus:RISK_STATUS})}
function setNote(k,v){if(v){NOTES[k]=v}else{delete NOTES[k]}localStorage.setItem('taxNotes',JSON.stringify(NOTES));apiSave({notes:NOTES})}
function exportNotes(){
  var allData={notes:NOTES,riskStatus:RISK_STATUS,taxRules:TAX_RULES,exportTime:new Date().toISOString(),version:'2.0'};
  var blob=new Blob([JSON.stringify(allData,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='税费核对备注_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();URL.revokeObjectURL(a.href);
}
function importNotes(ev){
  var file=ev.target.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var data=JSON.parse(e.target.result);
      if(data.notes){Object.assign(NOTES,data.notes);localStorage.setItem('taxNotes',JSON.stringify(NOTES))}
      if(data.riskStatus){Object.assign(RISK_STATUS,data.riskStatus);localStorage.setItem('taxRiskStatus5',JSON.stringify(RISK_STATUS))}
      if(data.taxRules){Object.assign(TAX_RULES,data.taxRules);saveTaxRules()}
      var nCnt=Object.keys(data.notes||{}).length;
      var rCnt=Object.keys(data.riskStatus||{}).length;
      var tCnt=Object.keys(data.taxRules||{}).length;
      alert('导入成功！备注 '+nCnt+' 条，风险状态 '+rCnt+' 条，税务规则 '+tCnt+' 个主体');
      render();
    }catch(err){alert('导入失败：文件格式错误')}
  };
  reader.readAsText(file);
  ev.target.value='';
}

function fmt(v){if(v==null||v===undefined)return'-';if(Math.abs(v)<.005)return'-';return v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function fmtS(v){if(v==null||v===undefined)return'-';if(Math.abs(v)<.005)return'-';if(v<0)return'('+Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+')';return v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function fmtP(v){if(v==null)return'-';return(v*100).toFixed(1)+'%'}
function getMonths(ent){
  var ms=new Set();
  ent.accounts.forEach(function(a){
    Object.keys(a.monthlyBreakdown||{}).forEach(function(m){ms.add(m)});
    (a.subAccounts||[]).forEach(function(sa){Object.keys(sa.monthlyBreakdown||{}).forEach(function(m){ms.add(m)})});
  });
  var arr=Array.from(ms).sort();
  return arr;
}
function monthLabel(m){var p=m.split('-');return p[0]+'年'+parseInt(p[1])+'月'}
var LEVELS={high:'高',medium:'中',low:'低'};
var LCSS={high:'hi',medium:'md',low:'lo'};

function getEntries(entity,fullName){var ed=ENTRIES_DATA[entity];if(!ed)return[];return ed[fullName]||[]}

function allRisks(){var r=[];DATA.forEach(function(e){e.risks.forEach(function(rk){r.push(Object.assign({},rk,{entity:e.entity,company:e.company}))})});return r}
function cntLevel(lv){return allRisks().filter(function(r){return(RISK_STATUS[r.id]||'open')==='open'&&r.level===lv}).length}
function cntOpen(){return allRisks().filter(function(r){return(RISK_STATUS[r.id]||'open')==='open'}).length}
function cntDone(){return allRisks().filter(function(r){return(RISK_STATUS[r.id]||'open')!=='open'}).length}

function entLabel(e){return e.entity+(e.company?' - '+e.company:'')}
function tcBadge(entityId,full){
  var e=DATA.find(function(d){return d.entity===entityId});if(!e)return '';
  var tc=e.taxCompliance||'';if(!tc)return '';
  if(tc==='是')return '<span style="margin-left:6px;font-size:'+(full?'12':'10')+'px;color:#22c55e" title="完税证明：是">✅完税</span>';
  if(tc.indexOf('无')>=0||tc.indexOf('需申请')>=0)return '<span style="margin-left:6px;font-size:'+(full?'12':'10')+'px;color:#ef4444" title="完税证明：'+tc+'">❌'+(full?' '+tc:'未完税')+'</span>';
  return '<span style="margin-left:6px;font-size:'+(full?'12':'10')+'px;color:#f59e0b" title="完税证明：'+tc+'">⚠️'+(full?' '+tc:'特殊')+'</span>';
}

var TAX_RULES={};try{TAX_RULES=JSON.parse(localStorage.getItem('taxRules')||'{}')}catch(e){TAX_RULES={}};
function saveTaxRules(){localStorage.setItem('taxRules',JSON.stringify(TAX_RULES));apiSave({taxRules:TAX_RULES})}
function renderTaxRules(){
  if(!ENTITY_FILTER)return '';
  var ent=DATA.find(function(e){return e.entity===ENTITY_FILTER});if(!ent)return '';
  var taxTypes=[];
  ent.accounts.filter(function(a){return a.isParent}).forEach(function(acc){
    if(taxTypes.indexOf(acc.parentName)<0)taxTypes.push(acc.parentName);
  });
  if(!taxTypes.length)return '';
  var rules=TAX_RULES[ENTITY_FILTER]||{};
  var h='<div class="sec"><div class="sec-t">📖 '+entLabel(ent)+' 税务规则</div>';
  h+='<div style="overflow-x:auto"><table class="rtable" style="font-size:12px"><tr><th style="width:100px">税种</th><th>税务规则</th></tr>';
  taxTypes.forEach(function(t){
    var r=rules[t]||'';
    h+='<tr><td class="ctr"><strong>'+t+'</strong></td><td contenteditable="true" style="min-height:28px;line-height:1.6;padding:6px 10px;outline:none" data-entity="'+ENTITY_FILTER+'" data-tax="'+t+'"'+(r?'':' data-placeholder="1"')+' onfocus="if(this.getAttribute(\'data-placeholder\')){this.innerText=\'\';this.removeAttribute(\'data-placeholder\');this.style.background=\'var(--bg3)\'}else{this.style.background=\'var(--bg3)\'}" oninput=\"saveTaxRule(this)\" onblur="this.style.background=\'\';saveTaxRule(this)">'+(r||'<span style="color:var(--tx2)">点击编辑税务规则…</span>')+'</td></tr>';
  });
  h+='</table></div></div>';
  return h;
}
function saveTaxRule(el){
  var eid=el.getAttribute('data-entity'),tax=el.getAttribute('data-tax');
  if(!TAX_RULES[eid])TAX_RULES[eid]={};
  var txt=el.innerText.trim();
  if(txt&&txt!=='点击编辑税务规则…')TAX_RULES[eid][tax]=txt;else delete TAX_RULES[eid][tax];
  saveTaxRules();
}
function entShort(e){return e.entity}

function render(){
  var app=document.getElementById('app');
  var h='';
  h+='<div class="hdr"><h1>🏛️ 主体税费申报核对查看器</h1><p class="sub">期间：2026年1-9月 · 主体数：'+DATA.length+' · 待处理风险：'+cntOpen()+'</p></div>';
  h+='<div class="summary-grid">';
  [['high','hi','高风险'],['medium','md','中风险'],['low','lo','低风险']].forEach(function(x){
    var act=RISK_FILTER===x[0]?' act':'';
    h+='<div class="scard '+x[1]+act+'" onclick="setRiskFilter(RISK_FILTER===&quot;'+x[0]+'&quot;?null:&quot;'+x[0]+'&quot;)"><div class="val">'+cntLevel(x[0])+'</div><div class="lbl">'+x[2]+'</div></div>';
  });
  var actOk=RISK_FILTER==='done'?' act':'';
  h+='<div class="scard ok'+actOk+'" onclick="setRiskFilter(RISK_FILTER===&quot;done&quot;?null:&quot;done&quot;)"><div class="val">'+cntDone()+'</div><div class="lbl">已处理</div></div>';
  h+='</div>';
  h+='<div class="fbar"><label>主体：</label><select class="fsel" onchange="setEntity(this.value)"><option value="">全部主体</option>';
  DATA.forEach(function(e){var sel=ENTITY_FILTER===e.entity?' selected':'';h+='<option value="'+e.entity+'"'+sel+'>'+entLabel(e)+'</option>'});
  h+='</select>';
  // Tax compliance badge next to entity filter
  if(ENTITY_FILTER){var ent=DATA.find(function(e){return e.entity===ENTITY_FILTER});if(ent&&ent.taxCompliance)h+=tcBadge(ent.entity,true)}
  if(RISK_FILTER)h+='<div class="fbtn act" onclick="setRiskFilter(null)">✕ 清除筛选</div>';

function renderRiskTable(){

  });
  h+='</table></div></div>';return h;
}

    });

    ent.accounts.filter(function(a){return a.parentCode===acc.parentCode&&!a.isParent}).forEach(function(sa){
      var sbd=sa.monthlyBreakdown||{};var smd=sa.monthly||{};var hasSub=MONTHS.some(function(m){return sbd[m]&&(sbd[m].hasAccrual||sbd[m].hasPayment||sbd[m].entryCount>0)});
      // For VAT sub-accounts, use parent's monthly balance (VAT = output - input, only parent balance is meaningful)

<0)oua.push(a)});sTxt='✅冲销'+oua.map(function(a){var mi=MONTHS.indexOf(a);return mi>=0?ML[mi]:a}).join('+')+'计提'}else{sTxt='冲销'}}else{sTxt='-'}
      var snk=ent.entity+'-'+sa.fullCode+'-'+m;var snv=NOTES[snk]||'';

function setEntity(v){ENTITY_FILTER=v||null;render()}
function setRiskFilter(v){RISK_FILTER=v;render()}
function cycleStatus(id){var c=RISK_STATUS[id]||'open';RISK_STATUS[id]={open:'resolved',resolved:'ignored',ignored:'open'}[c];save();render()}
function toggleP(el){el.parentElement.classList.toggle('open')}
function toggleE(a,entity,fullName,containerId){
  var d=document.getElementById(containerId);
  if(d.style.display==='none'){d.style.display='block';a.textContent='▼ '+a.textContent.substring(2);if(!d.dataset.loaded){renderEntries(getEntries(entity,fullName),d);d.dataset.loaded='1'}}
  else{d.style.display='none';a.textContent='▶ '+a.textContent.substring(2)}
}
function renderEntries(entries,container){
  if(!entries||!entries.length){container.innerHTML='<div style="text-align:center;padding:12px;color:var(--tx2)">无明细</div>';return}
  var h='<table><tr><th>日期</th><th>凭证</th><th>类型</th><th>借方</th><th>贷方</th><th>余额</th><th>摘要</th></tr>';
  var clsMap={accrual:'acc',payment:'pay',offset_credit:'off',offset_debit:'off',other:''};var tlMap={accrual:'计提',payment:'缴纳',offset_credit:'冲销',offset_debit:'冲销',other:'其他'};
  entries.forEach(function(e){var cls=clsMap[e.entryType]||'';var tl=tlMap[e.entryType]||'';h+='<tr><td>'+e.date+'</td><td>'+e.voucher+'</td><td class="'+cls+'">'+tl+'</td><td class="num">'+fmt(e.debit)+'</td><td class="num">'+fmt(e.credit)+'</td><td class="num">'+fmt(e.balance)+'</td><td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(e.summary||'').substring(0,50)+'</td></tr>'});
  h+='</table>';container.innerHTML=h;
}
function exportCSV(){
  var NL=String.fromCharCode(10);
  var csv='';
  // Part 1: Tax Rules (if entity selected)
  if(ENTITY_FILTER){
    var ent=DATA.find(function(e){return e.entity===ENTITY_FILTER});
    if(ent){
      var rules=TAX_RULES[ENTITY_FILTER]||{};
      var taxTypes=[];
      ent.accounts.filter(function(a){return a.isParent}).forEach(function(acc){
        if(taxTypes.indexOf(acc.parentName)<0)taxTypes.push(acc.parentName);
      });
      csv+='主体税务规则'+NL;
      csv+='主体,税种,税务规则'+NL;
      taxTypes.forEach(function(t){
        csv+=ENTITY_FILTER+','+t+','+(rules[t]||'')+NL;
      });
      csv+=NL;
    }
  }else{
    // All entities with rules
    var hasRules=Object.keys(TAX_RULES).length>0;
    if(hasRules){
      csv+='主体税务规则'+NL;
      csv+='主体,税种,税务规则'+NL;
      Object.keys(TAX_RULES).forEach(function(eid){
        Object.keys(TAX_RULES[eid]).forEach(function(tax){
          csv+=eid+','+tax+','+TAX_RULES[eid][tax]+NL;
        });
      });
      csv+=NL;
    }
  }
  // Part 2: Risk Summary
  var risks=allRisks();
  if(ENTITY_FILTER)risks=risks.filter(function(r){return r.entity===ENTITY_FILTER});
  if(RISK_FILTER&&RISK_FILTER!=='done')risks=risks.filter(function(r){return r.level===RISK_FILTER});
  if(RISK_FILTER==='done')risks=risks.filter(function(r){return(RISK_STATUS[r.id]||'open')!=='open'});
  risks.sort(function(a,b){var ord={high:0,medium:1,low:2};return(ord[a.level]-ord[b.level])||(a.entity.localeCompare(b.entity))});
  csv+='风险事项汇总（'+risks.length+'项）'+NL;
  csv+='主体,公司,风险等级,税种,风险类型,风险描述,期末余额,状态'+NL;
  risks.forEach(function(r){
    var st=RISK_STATUS[r.id]||'open';
    var stLabel={open:'待处理',resolved:'已处理',ignored:'忽略'}[st]||st;
    var desc=(r.description||'').replace(/[,\"\n]/g,' ');
    var sug=(r.suggestion||'').replace(/[,\"\n]/g,' ');
    if(sug)desc+=' 💡'+sug;
    csv+=r.entity+','+(r.company||'')+','+({high:'高',medium:'中',low:'低'}[r.level]||r.level)+','+r.taxType+','+r.type+','+desc+','+(r.lastBalance!=null?r.lastBalance:'')+','+stLabel+NL;
  });
  var blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='税务规则及风险汇总_'+new Date().toISOString().slice(0,10)+'.csv';a.click();URL.revokeObjectURL(url);
}
